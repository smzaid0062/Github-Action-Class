name: CICD
on:
  workflow_dispatch:
    inputs:
      environment:
       description: This is the envioronment value where this workflow runs
       default: 'dev'
       required: true
       type: choice
       options:
         - dev
         - prod
         - staging
    
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        run: echo " Code clone from github"
  build:
    needs:
      - code
    runs-on: ubuntu-latest
    steps:
      - name: Build docekr container
        run: echo "Docker container build"
  test:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Testing the container
        run: echo "Test the container"
  deploye:
    if: inputs.environment == 'prod'
    needs:
      - build
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Deploying the container
        run: echo "Deploying the contaienr"
