name: CICD
on:
  push:
    branches: main

    paths:
      - '**.html'
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        run: echo "Code Clone from github"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker Container
        run: echo "Bulding the container"
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Testing the application
        run: echo "Testing the app"
  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploying the app
        run: echo "Deploying the app"
