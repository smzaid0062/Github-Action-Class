name: CICD
on:
  workflow_dispatch:
    inputs:
     environment:
      description: This is the enviornment value where this workflow runs
      default: 'dev'
      required: true
      type: choice
      options:
        - dev
        - prod
        - staging
        
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        run: echo "Code Clone from github"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker Container
        run: echo "Bulding the container"
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Testing the application
        run: echo "Testing the app"
  deploy:
    if: inputs.environment == 'dev'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploying the app
        run: echo "Deploying the app"
